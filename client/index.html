<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ImgMgr by Tillerz</title>
  <link rel="stylesheet" href="/style.css" />
  <!-- Theme overrides. Scoped to html[data-theme="…"], so it costs nothing
       until the theme picker selects it. -->
  <link rel="stylesheet" href="/theme-modern.css" />
  <script>
    // Apply the saved theme before first paint to avoid a flash of the
    // default styling on reload.
    try {
      var t = JSON.parse(localStorage.getItem('imgmgr.theme') || '""');
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
